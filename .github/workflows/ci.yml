name: Continuous Integration
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Check changed files
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - "src/**"
              - "package.json"
              - "yarn.lock"
            functions:
              - "cloud/functions/**"

      # ── Frontend (Only runs if frontend files changed) ───────────
      - name: Get Yarn cache directory
        if: steps.changes.outputs.frontend == 'true'
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore Frontend Cache (Yarn)
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: node-cache-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: node-cache-${{ runner.os }}-yarn-

      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn lint

      - name: Test frontend
        if: steps.changes.outputs.frontend == 'true'
        run: yarn test

      # ── Backend (Only runs if cloud/functions files changed) ─────
      - name: Restore Backend Cache (NPM)
        if: steps.changes.outputs.functions == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-npm-${{ hashFiles('cloud/functions/package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-npm-

      - name: Lint functions
        if: steps.changes.outputs.functions == 'true'
        working-directory: ./cloud/functions
        run: |
          npm ci --ignore-scripts
          npm run lint --max-warnings=0
          npm run build
