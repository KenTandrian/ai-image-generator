name: Cleanup Caches
on:
  workflow_run:
    workflows:
      - "Warm Caches"
      - "Lockfile Maintenance (Frontend)"
      - "Lockfile Maintenance (Functions)"
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-frontend:
    uses: KenTandrian/workflows/.github/workflows/cleanup.yml@main
    with:
      name: Yarn
      pattern: node-cache-Linux-yarn-

  cleanup-functions:
    uses: KenTandrian/workflows/.github/workflows/cleanup.yml@main
    with:
      name: NPM
      pattern: node-cache-Linux-npm-
