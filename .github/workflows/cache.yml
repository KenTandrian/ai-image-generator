name: Cache Node.js Dependencies
on:
  push:
    branches: ["main"]
    paths:
      - "yarn.lock"
      - "package.json"
      - "cloud/functions/package-lock.json"
      - "cloud/functions/package.json"
  workflow_dispatch:

jobs:
  cache-yarn:
    name: Cache frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: 📁 Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: ☁️ Cache Yarn
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: node-cache-${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: node-cache-${{ runner.os }}-yarn-

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

  cache-npm:
    name: Cache backend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: ☁️ Cache NPM
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-npm-${{ hashFiles('cloud/functions/package-lock.json') }}
          restore-keys: node-cache-${{ runner.os }}-npm-

      - name: 📦 Install dependencies
        working-directory: ./cloud/functions
        run: npm ci --ignore-scripts
