name: PR Auto-Reviewer

on:
  pull_request_target:
    paths:
      - "yarn.lock"
      - "package.json"
      - "cloud/functions/package-lock.json"
      - "cloud/functions/package.json"

permissions:
  pull-requests: write
  contents: write
  repository-projects: read

jobs:
  review-dependabot-pr:
    name: PR Review
    uses: KenTandrian/workflows/.github/workflows/dependabot-reviewer.yml@main
